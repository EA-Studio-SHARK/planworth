<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./avatar.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ExploreAI 充值一件套：看懂防封号规则，算清同样的钱能换多少 token，充值后查环境、核对模型。"
    />
    <title>ExploreAI</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("exploreai-theme");
          if (t !== "dark" && t !== "light") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          var l = localStorage.getItem("exploreai-lang");
          if (l === "en" || (l === "auto" && /^en\b/i.test(navigator.language))) {
            document.documentElement.lang = "en";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
