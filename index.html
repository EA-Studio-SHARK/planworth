    <script>
      (function () {
        try {
          var h = location.hash;
          if (h.length > 2 && h.charAt(1) === "/") {
            history.replaceState(null, "", h.slice(1) + location.search);
          }
          var t = localStorage.getItem("exploreai-theme");
          if (t !== "dark" && t !== "light") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          var l = localStorage.getItem("exploreai-lang");
          if (l === "en" || (l === "auto" && /^en\b/i.test(navigator.language))) {
            document.documentElement.lang = "en";
          }
        } catch (e) {}
      })();
    </script>
