# 06:30 Beijing time: collect the day's material. The Claude routine writes the brief from it at 07:30.
# Shop prices aren't fetched here: the shop's firewall rejects GitHub's servers, so a local task refreshes them.
name: Fetch daily material

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test the fetchers without committing or deploying"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pick the date
        run: |
          date_cn=$(TZ=Asia/Shanghai date +%F)
          # A dry run uses tomorrow so it really fetches instead of reusing today's files.
          if [ "$DRY_RUN" = "true" ]; then date_cn=$(TZ=Asia/Shanghai date -d tomorrow +%F); fi
          echo "BRIEF_DATE=$date_cn" >> "$GITHUB_ENV"
      - name: Fetch brief material
        run: node scripts/fetch-brief.mjs "$BRIEF_DATE"
      - name: Show what was fetched
        run: |
          node -e '
            const d = process.env.BRIEF_DATE;
            const raw = JSON.parse(require("fs").readFileSync(`src/data/brief-raw/${d}.json`, "utf8"));
            const readmes = JSON.parse(require("fs").readFileSync(`src/data/brief-raw/${d}.readmes.json`, "utf8"));
            const read = Object.values(readmes).filter((r) => r.excerpt).length;
            console.log(`repos=${raw.repos.length} launches=${raw.launches.length} readmes=${read}`);
            if (!raw.launches.length) { console.error("Product Hunt returned nothing"); process.exit(1); }
          '
      - name: Commit material
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "exploreai-bot"
          git config user.email "exploreai-bot@users.noreply.github.com"
          git add src/data/brief-raw src/data/github-hot.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily material $BRIEF_DATE"
          git push origin HEAD:main
